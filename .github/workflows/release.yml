name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Single source of truth for the rivet pin (matches ci.yml).
env:
  RIVET_PIN: c7f9881d25acea50babd51a2a48672ce0cf99b1f

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag matches VERSION, rivet.rktd, app/version.rkt
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Check CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^## $TAG" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }

  macos:
    name: macOS build (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            racket-arch: arm64
          - arch: x64
            runner: macos-15-intel
            racket-arch: x64
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (${{ matrix.racket-arch }})
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          architecture: ${{ matrix.racket-arch }}
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Package (ad-hoc; notarization activates when secrets exist)
        run: raco rivet package
      - name: Update-feed zip + checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent dist/podlens.app \
            "podlens-${VERSION}-macos-${{ matrix.arch }}.zip"
          shasum -a 256 "podlens-${VERSION}-macos-${{ matrix.arch }}.zip" \
            > "podlens-${VERSION}-macos-${{ matrix.arch }}.zip.sha256"
      - name: Human installer (DMG) + checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          hdiutil create -volname PodLens -srcfolder dist/podlens.app -ov -format UDZO \
            "podlens-${VERSION}-macos-${{ matrix.arch }}.dmg"
          shasum -a 256 "podlens-${VERSION}-macos-${{ matrix.arch }}.dmg" \
            > "podlens-${VERSION}-macos-${{ matrix.arch }}.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            podlens-*-macos-*.dmg
            podlens-*-macos-*.dmg.sha256
            podlens-*-macos-*.zip
            podlens-*-macos-*.zip.sha256
          if-no-files-found: error

  windows:
    name: Windows MSI + portable zip
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: Install WiX (v5; v7 requires EULA acceptance, v5 runs the v4 schema)
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash
      - name: Package + MSI (rivet release, development signing)
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turinglambdaai/podlens/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: podlens-2026-10
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          KEY_PEM="$(mktemp)"
          printf '%s\n' "$UPDATE_ED25519_PRIVATE_KEY" > "$KEY_PEM"
          openssl pkey -in "$KEY_PEM" -outform DER -out "$KEY_DER"
          rm -f "$KEY_PEM"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          raco rivet release --development
          rm -f "$KEY_DER"
          # podlens ships one merged signed feed from the publish job; the
          # per-windows manifest rivet emits here is not shipped.
          rm -f dist/update-*.json
        shell: bash
      - name: Collect MSI + portable zip + checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          # rivet v0.11.0 emits the MSI and the portable zip directly in
          # family form — no staging directory to compress anymore.
          sha256sum "podlens-${VERSION}-windows-x64.msi" > "podlens-${VERSION}-windows-x64.msi.sha256"
          sha256sum "podlens-${VERSION}-windows-x64.zip" > "podlens-${VERSION}-windows-x64.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/podlens-*-windows-x64.msi
            dist/podlens-*-windows-x64.msi.sha256
            dist/podlens-*-windows-x64.zip
            dist/podlens-*-windows-x64.zip.sha256
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@v0.11.0
      # Installed after the embeddable runtime so the catalog dependency
      # closure (cext-lib, crypto-lib, keel) resolves against the minimal
      # build — it ships no packages of its own. crypto backs the updater.
      - name: Install Rivet (catalog) and backend packages
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
          raco pkg install --auto --no-docs crypto
      - name: Install GTK4, GStreamer, rpm and packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-4-dev libadwaita-1-dev libjson-glib-dev libsecret-1-dev \
            libglib2.0-dev cmake ninja-build pkg-config file \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            rpm desktop-file-utils
      # tar.gz (the update-feed payload) + deb + rpm + AppImage + portable
      # zip + SBOM, launch smoke included. The deb side-payload ships the
      # GStreamer plugin closure (base/good + gst-libav) so m4a/mp3 play on
      # stock Debian/Ubuntu; the AppImage carries its own GTK4 closure, and
      # APPIMAGE_EXTRACT_AND_RUN lets appimagetool run on the runner.
      - name: Release (tar.gz + deb + rpm + AppImage + portable zip)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: raco rivet release --without-updates --development
      - name: Collect artifacts + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          cd dist
          mv sbom.cdx.json "podlens-${VERSION}-linux-${ARCH}.sbom.cdx.json"
          mv THIRD_PARTY_NOTICES.txt "podlens-${VERSION}-linux-${ARCH}-THIRD_PARTY_NOTICES.txt"
          for f in podlens-*; do
            case "$f" in
              *.sha256) ;;
              *) [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256" ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/podlens-*
          if-no-files-found: error

  release:
    name: Sign manifest + publish
    needs: [macos, windows, linux]
    runs-on: macos-latest
    env:
      HAS_UPDATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket
        if: env.HAS_UPDATE_KEY == 'true'
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install Rivet (catalog; rivet/distribution signs the wrapper)
        if: env.HAS_UPDATE_KEY == 'true'
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Install OpenSSL 3
        if: env.HAS_UPDATE_KEY == 'true'
        run: brew install openssl@3
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifact dirs
        run: |
          find dist -mindepth 2 -maxdepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -maxdepth 1 -type d -empty -delete
          ls -la dist/
      # Family direct-download standard: the site and update feed point at
      # stable, version-less asset names, so a release re-uploads its
      # installers under these aliases next to the versioned originals.
      # Runs before the manifest step — that script looks up the exact
      # versioned file names, so the aliases cannot confuse it.
      - name: Stable alias names
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          cp "podlens-${VERSION}-macos-arm64.dmg" podlens-macos-arm64.dmg
          cp "podlens-${VERSION}-macos-x64.dmg" podlens-macos-x64.dmg
          cp "podlens-${VERSION}-macos-arm64.zip" podlens-macos-arm64.zip
          cp "podlens-${VERSION}-macos-x64.zip" podlens-macos-x64.zip
          cp "podlens-${VERSION}-windows-x64.msi" podlens-windows-x64.msi
          cp "podlens-${VERSION}-windows-x64.zip" podlens-windows-x64.zip
          # rivet names the linux installers with their distro arch strings;
          # the aliases normalize them to the family's x64/arm64.
          cp "podlens-${VERSION}-linux-amd64.deb" podlens-linux-x64.deb
          cp "podlens-${VERSION}-linux-arm64.deb" podlens-linux-arm64.deb
          cp "podlens-${VERSION}-linux-x86_64.AppImage" podlens-linux-x64.AppImage
          cp "podlens-${VERSION}-linux-aarch64.AppImage" podlens-linux-arm64.AppImage
          cp "podlens-${VERSION}-linux-x64.tar.gz" podlens-linux-x64.tar.gz
          cp "podlens-${VERSION}-linux-arm64.tar.gz" podlens-linux-arm64.tar.gz
          ls -la
      - name: Generate + sign update manifest
        if: env.HAS_UPDATE_KEY == 'true'
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          KEY_FILE=$(mktemp)
          printf '%s\n' "$UPDATE_ED25519_PRIVATE_KEY" > "$KEY_FILE"
          bash scripts/make-update-manifest.sh "${{ github.ref_name }}" dist "$KEY_FILE"
          rm -f "$KEY_FILE"
        # a release without the update key still ships; clients simply see
        # no manifest and stay on their version (::warning:: marks it)
      - name: SHA256SUMS
        run: |
          cd dist
          # strip stray CR from Windows-authored sums before checking
          cat *.sha256 | tr -d '\r' > SHA256SUMS
          shasum -a 256 --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" -R turinglambdaai/podlens >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber -R turinglambdaai/podlens
          else
            gh release create "${{ github.ref_name }}" dist/* \
              -R turinglambdaai/podlens \
              --title "PodLens ${{ github.ref_name }}" \
              --generate-notes
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*
