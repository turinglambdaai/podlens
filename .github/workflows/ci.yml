name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for the rivet pin; every install step below
# references this so a bump is one edit, not a grep-replace across jobs.
env:
  RIVET_PIN: 9d766b4acab672844093204cb4845ef4ef933d2c
jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Version preflight (VERSION == rivet.rktd == app/version.rkt)
        run: bash scripts/check-release-version.sh
        shell: bash
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: Compile backend
        run: raco make app/core/*.rkt app/update.rkt app/backend.rkt app/cli.rkt
        shell: bash
      - name: Run tests
        run: raco test tests/
        shell: bash
      # network-dependent: a dead feed must not block the pipeline, but a
      # failure is surfaced so the catalog gets pruned before the release
      - name: Verify curated catalog (soft)
        run: racket scripts/verify-catalog.rkt
        shell: bash
        continue-on-error: true
        if: matrix.os == 'ubuntu-latest'
      - name: CLI smoke
        shell: bash
        env:
          PODLENS_DATA_DIR: ${{ runner.temp }}/podlens-cli-smoke
        run: |
          racket app/cli.rkt version
          racket app/cli.rkt --json version
          racket app/cli.rkt doctor
          racket app/cli.rkt bad-command 2>/dev/null && exit 1 || test $? -eq 2

  macos-host:
    name: macOS host build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (CS, arm64)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          architecture: arm64
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Build + package + verify
        run: raco rivet package
      - name: Launch smoke (ad-hoc build)
        run: |
          open dist/podlens.app
          sleep 10
          pgrep -f "podlens.app" >/dev/null || { echo "::error::app did not stay running"; exit 1; }
          pkill -f "podlens.app" || true

  linux-host:
    name: Linux host (GTK4 build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK toolchain + GStreamer dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev libjson-glib-dev \
            libsecret-1-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      # Builds and caches the embeddable Racket CS runtime and exports
      # RIVET_RACKET_* (rivet's own composite action) — the Linux host links
      # a static libracketcs, which the distro Racket does not ship.
      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@9d766b4acab672844093204cb4845ef4ef933d2c
      # Installed after the embeddable runtime so the catalog dependency
      # closure (cext-lib, crypto-lib, keel) resolves against the minimal
      # build — it ships no packages of its own. crypto backs the updater.
      - name: Install Rivet (catalog) and backend packages
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
          raco pkg install --auto --no-docs crypto
      - name: Build host (generates linux/GeneratedBackend.hpp + compiles)
        run: raco rivet build
      - name: Headless boot smoke
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a ./.rivet/stage/RivetHost &
          APP_PID=$!
          sleep 8
          kill -0 $APP_PID
          kill $APP_PID

  windows-host:
    name: Windows host build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Build + package + verify
        run: raco rivet package
        shell: bash
