name: Diagnostics

on:
  workflow_dispatch:

jobs:
  print-update-public-key:
    # One-shot diagnostic for the update-key mismatch (#21 release blocker):
    # prints the public key derived from the CI signing secret so it can be
    # compared against the keys pinned in app/update.rkt and
    # UpdateService.swift. Public keys are not secret.
    runs-on: ubuntu-latest
    steps:
      - name: Derive public key from the signing secret
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$UPDATE_ED25519_PRIVATE_KEY" > "$KEY_FILE"
          openssl pkey -in "$KEY_FILE" -pubout -outform DER \
            | tail -c 32 | base64 | tr -d '\r\n' > pub.txt
          echo "::notice::CI-secret public key (base64, raw 32B): $(cat pub.txt)"
          echo "FINGERPRINT=$(cat pub.txt)" >> "$GITHUB_OUTPUT"
      - name: Show
        run: echo "pubkey=${{ steps.derive.outputs.FINGERPRINT }}" || true
