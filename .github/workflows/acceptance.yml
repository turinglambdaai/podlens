name: Product Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep every main/manual quality gate; only superseded runs of the same PR cancel.
  # A unique run ID also prevents a pending main run from replacing another.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RIVET_PIN: 9d766b4acab672844093204cb4845ef4ef933d2c
  KEEL_PIN: 76a5b9fdd01bde284d310ff5c05ec73972f64201

jobs:
  windows:
    name: Windows packaged WinUI acceptance
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: stable
      - name: Export trusted Mozilla CA roots for Windows Racket
        shell: pwsh
        run: |
          # Racket's Windows ROOT-store loader may throw X509*->C on hosted images.
          # Node bundles independent Mozilla roots; do not bypass TLS validation.
          $bundle = Join-Path $env:RUNNER_TEMP 'podlens-mozilla-roots.pem'
          $js = 'const tls=require("node:tls"),fs=require("node:fs"); if(tls.rootCertificates.length<50) process.exit(2); fs.writeFileSync(process.argv[1],tls.rootCertificates.join("\n")+"\n",{flag:"wx"});'
          node -e $js $bundle
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $bundle -PathType Leaf)) {
            throw "Unable to export trusted CA roots; refusing insecure TLS fallback"
          }
          "PODLENS_CI_CA_BUNDLE=$bundle" >> $env:GITHUB_ENV
      - name: Install pinned dependencies with verified TLS
        shell: pwsh
        run: racket scripts/ci-install-windows-deps.rkt --acceptance
      - name: Run executable acceptance contract
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .rivet\acceptance | Out-Null
          $report = & raco rivet acceptance --json
          $status = $LASTEXITCODE
          $report | Tee-Object -FilePath .rivet\acceptance\report.json
          exit $status
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podlens-acceptance-windows
          path: .rivet/acceptance
          if-no-files-found: warn

  macos:
    name: macOS packaged SwiftUI acceptance (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15, racket-arch: arm64 }
          - { arch: x64, runner: macos-15-intel, racket-arch: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: stable
      - name: Install pinned dependencies
        run: |
          raco pkg install --auto --no-docs "https://github.com/turlamai/keel.git#${KEEL_PIN}"
          raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${RIVET_PIN}"
          raco pkg install --auto --no-docs --skip-installed crypto
      - name: Run executable acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rivet/acceptance
          raco rivet acceptance --json | tee .rivet/acceptance/report.json
      - name: Upload macOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podlens-acceptance-macos-${{ matrix.arch }}
          path: .rivet/acceptance
          if-no-files-found: warn

  linux:
    name: Linux packaged GTK4 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@9d766b4acab672844093204cb4845ef4ef933d2c
      - name: Install native and pinned Racket dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes at-spi2-core dbus-x11 libgtk-4-dev \
            libadwaita-1-dev libjson-glib-dev libsecret-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            python3-pyatspi weston
          raco pkg install --auto --no-docs "https://github.com/turlamai/keel.git#${KEEL_PIN}"
          raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${RIVET_PIN}"
          raco pkg install --auto --no-docs --skip-installed crypto
      - name: Run executable acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .rivet/acceptance
          dbus-run-session -- bash -c \
            'set -euo pipefail; raco rivet acceptance --json | tee .rivet/acceptance/report.json'
      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podlens-acceptance-linux
          path: .rivet/acceptance
          if-no-files-found: warn
